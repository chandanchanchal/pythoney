version 0.1
source: samples.tpch.orders

dimensions:
     - name: Order Date
       expr: o_orderdate
       
     - name: Order Priority
       expr: o_orderpriority
       
     - name: Order Status
       expr: o_orderstatus
       
     - name: Order Status Readable
       expr: >
          case
           when o_orderstatus = 'O' then 'Open'
           when o_orderstatus = 'F' then 'fulfilled'
           when o_orderstatus = 'P' then 'Processed'
       
measures:
   - name: Average Total Price
     expr: AVG(o_totalPrice)
     
   - name: Total Price
     expr: SUM(o_totalPrice)
     
   - name: Total Orders
     expr: Count( DISTINCT o_totalPrice)
     
